name: Something the transcript should report but doesn't
description: An effect, trigger or card interaction that happened but never appears
labels: ["enhancement", "parser"]
body:
  - type: markdown
    attributes:
      value: |
        The transcript is fog-of-war by nature — it only knows what your client was told.
        Some things are genuinely absent from the log; others were simply never read out
        of it. This template is for working out which.

        Worth knowing: several things believed missing turned out to be present all along,
        including spell targets, which sat unread in a second annotation array for months.
        So "the log doesn't have it" is not assumed here.

  - type: input
    id: build
    attributes:
      label: Build stamp
      placeholder: Written by mtga-pbp 0.4.0+a9ad4257
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened in the game that isn't in the transcript
      description: Name the cards and the interaction, as specifically as you can.
    validations:
      required: true

  - type: textarea
    id: around
    attributes:
      label: The transcript around where it should be
      description: Paste a few lines either side, with screen names removed.
      render: markdown

  - type: textarea
    id: stats
    attributes:
      label: Output of `mtga-pbp stats`
      description: |
        This is the useful one for missing detail — it lists every annotation type the
        parser saw and did not handle. If the thing you are missing is in that list, it is
        in the log and just isn't being read.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have removed both players' screen names and any `C:\Users\...` paths
          required: true

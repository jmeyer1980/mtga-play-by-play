name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # This is a Windows-only tool — the log, the card database and the shell
    # handler for --open are all Windows. Testing anywhere else would prove
    # something we do not ship.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # collection.txt says which cards one Arena account owns, and this repository is
      # public. It is committed empty and .gitattributes binds it to a clean filter that
      # empties it on the way into a commit — but git will not take a filter command
      # from a repository, so a fresh clone does not have it. Checked here rather than
      # trusted, for the same reason the fixture scrub is asserted in a test: it is
      # exactly the kind of file someone repopulates later without knowing the rule.
      - name: Guard the committed collection stays empty
        shell: pwsh
        run: |
          $size = git cat-file -s HEAD:collection.txt
          if ($LASTEXITCODE -ne 0) {
            throw "collection.txt is not committed. It must exist and be empty."
          }
          if ([int]$size -ne 0) {
            Write-Host "::error file=collection.txt::collection.txt is $size bytes; it must be committed empty."
            Write-Host "Set the strip filter, then re-commit the file:"
            Write-Host "  git config filter.strip-collection.clean true"
            Write-Host "  git rm --cached collection.txt; git add collection.txt"
            throw "collection.txt carries card ownership and this repository is public."
          }
          Write-Host "collection.txt is committed empty"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      # A few tests cannot run here, and this fails the build if that set ever grows.
      # Silently shrinking coverage is exactly what it guards against.
      - name: Guard against unexpectedly skipped tests
        shell: pwsh
        run: |
          $trx = Get-ChildItem artifacts/test-results -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { throw "no test results found" }
          [xml]$x = Get-Content $trx.FullName
          $c = $x.TestRun.ResultSummary.Counters
          $total = [int]$c.total; $passed = [int]$c.passed; $failed = [int]$c.failed
          $skipped = $total - $passed - $failed
          Write-Host "total=$total passed=$passed failed=$failed skipped=$skipped"

          # 7 CardDbIntegrationTests needing Arena's card database (the card-face
          # lookups for #99 added three), the Explicit fixture generator, and the
          # documented targeting-limitation warning.
          # The golden-file tests are NOT in here — they run on a checked-in name
          # fixture, so the end-to-end check runs on CI too.
          $expected = 9
          if ($skipped -gt $expected) {
            throw "$skipped tests did not run; at most $expected are expected to skip on CI. Something stopped running rather than started failing."
          }
          Write-Host "guard ok"

      - name: Audit dependencies
        run: |
          dotnet list package --vulnerable --include-transitive
          dotnet list package --deprecated

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

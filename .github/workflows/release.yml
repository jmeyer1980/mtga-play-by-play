name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "version '$v' is not semver; tag releases as v1.2.3"
          }
          "version=$v"  >> $env:GITHUB_OUTPUT
          "tag=v$v"     >> $env:GITHUB_OUTPUT
          Write-Host "building $v"

      # Never ship something that was not tested, even on a tag push.
      - name: Test
        run: dotnet test --configuration Release

      - name: Publish self-contained exe
        run: >
          dotnet publish src/MtgaPbp.Cli
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      # Until now the zip shipped an executable nobody had ever run. The Test step
      # above exercises a different artifact: framework-dependent, many files, ordinary
      # AppContext.BaseDirectory. This one is self-contained, single-file and
      # self-extracting, which is exactly where BaseDirectory changes meaning — and
      # Config.Load sits directly on top of it. --version answers before any I/O, so it
      # proves the host starts and the version was stamped, which is the failure this
      # cannot afford to ship.
      - name: Smoke-run the published exe
        shell: pwsh
        run: |
          $want = '${{ steps.version.outputs.version }}'
          $out = & ./publish/mtga-pbp.exe --version 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "the published exe exited $code" }
          if ($out -notmatch [regex]::Escape("mtga-pbp $want")) {
            throw "the published exe reports something other than 'mtga-pbp $want'"
          }
          Write-Host "smoke ok - the shipped exe runs and is stamped $want"

      - name: Assemble the package
        id: package
        shell: pwsh
        run: |
          $name = "mtga-pbp-${{ steps.version.outputs.tag }}-win-x64"
          New-Item -ItemType Directory -Force staging | Out-Null

          Copy-Item publish/mtga-pbp.exe staging/
          Copy-Item README.md staging/

          # Ship a config that opens the report, because the console window closes
          # too fast to read the output path when the exe is double-clicked.
          #
          # NOT named mtga-pbp.json. That is the user's file, and unzipping an upgrade
          # over the install folder replaced whatever they had put in it — forgetting a
          # custom ArchiveDir, so the next run built a fresh archive at the default
          # location and the report came up empty (#134). This one is read first and
          # theirs wins over it, so an upgrade can overwrite this file freely.
          '{ "OpenAfterBuild": true }' |
            Set-Content staging/mtga-pbp.defaults.json -Encoding utf8

          Compress-Archive -Path staging/* -DestinationPath "$name.zip" -Force

          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii

          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "packaged $name.zip ($([math]::Round((Get-Item "$name.zip").Length/1MB)) MB)"
          Write-Host "sha256 $hash"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.package.outputs.name }}'

          if (-not (git tag -l $tag)) { git tag $tag; git push origin $tag }

          gh release create $tag `
            "$name.zip" "$name.zip.sha256" `
            --title $tag `
            --generate-notes `
            --notes "Self-contained Windows x64 build — no .NET install required. Unzip and run ``mtga-pbp.exe``. Requires MTG Arena with Detailed Logs (Plugin Support) enabled."

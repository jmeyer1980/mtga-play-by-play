ShortDescription: "Turns Magic: The Gathering Arena match logs into readable text transcripts."
Description: |-
  Reads Magic: The Gathering Arena's local match log and turns it into readable,
  searchable, shareable text transcripts — a chess-style play-by-play of each game
  rather than a visual replay.

  Produces an HTML index of every archived match, sortable and searchable by
  opponent, event, result and any card that appeared, plus a self-contained page per
  game with a readable "beats" view, a verbose view, and a copy-to-clipboard button.
  Markdown exports are written alongside for pasting into chat.

  Everything resolves locally against Arena's own card database; the tool makes no
  network requests. Requires MTG Arena with Detailed Logs (Plugin Support) enabled.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "version '$v' is not semver; tag releases as v1.2.3"
          }
          "version=$v"  >> $env:GITHUB_OUTPUT
          "tag=v$v"     >> $env:GITHUB_OUTPUT
          Write-Host "building $v"

      # Never ship something that was not tested, even on a tag push.
      - name: Test
        run: dotnet test --configuration Release

      - name: Publish self-contained exe
        run: >
          dotnet publish src/MtgaPbp.Cli
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Assemble the package
        id: package
        shell: pwsh
        run: |
          $name = "mtga-pbp-${{ steps.version.outputs.tag }}-win-x64"
          New-Item -ItemType Directory -Force staging | Out-Null

          Copy-Item publish/mtga-pbp.exe staging/
          Copy-Item README.md staging/

          # Ship a config that opens the report, because the console window closes
          # too fast to read the output path when the exe is double-clicked.
          '{ "OpenAfterBuild": true }' | Set-Content staging/mtga-pbp.json -Encoding utf8

          Compress-Archive -Path staging/* -DestinationPath "$name.zip" -Force

          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii

          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "packaged $name.zip ($([math]::Round((Get-Item "$name.zip").Length/1MB)) MB)"
          Write-Host "sha256 $hash"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.package.outputs.name }}'

          if (-not (git tag -l $tag)) { git tag $tag; git push origin $tag }

          gh release create $tag `
            "$name.zip" "$name.zip.sha256" `
            --title $tag `
            --generate-notes `
            --notes "Self-contained Windows x64 build — no .NET install required. Unzip and run ``mtga-pbp.exe``. Requires MTG Arena with Detailed Logs (Plugin Support) enabled."

name: Bug report
description: Something in the transcript is wrong, missing, or invented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Before anything else, please check the build stamp** —
        it settles more reports than any other single line.

        Every page and markdown export ends with `Written by mtga-pbp <version>+<commit>`,
        and `watch` prints it on startup. A `watch` left running from an older copy keeps
        rewriting the whole report with that copy's code, so the output can be stale even
        though you downloaded a newer version. That has been the answer twice.

  - type: input
    id: build
    attributes:
      label: Build stamp
      description: From the bottom of any report page, or the first line `watch` prints.
      placeholder: Written by mtga-pbp 0.3.1+5f79196f
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What the transcript says
      description: |
        Paste the lines. **Please replace both players' screen names first** — this is a
        public tracker and the log carries real handles.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What actually happened in the game
      description: |
        The most valuable reports are the ones where the transcript states something that
        did not happen — a card that was never cast, a creature attacking that could not,
        a card sent to the wrong zone. Say what you remember of the real play.
    validations:
      required: true

  - type: dropdown
    id: shape
    attributes:
      label: Match shape
      description: Multi-game matches exercise a lot of code that a Bo1 never touches.
      options:
        - Bo1 — single game
        - Bo3 — two games played
        - Bo3 — three games played
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: How you ran it
      options:
        - Double-clicked the exe
        - watch
        - From a terminal
        - Built from source
    validations:
      required: true

  - type: textarea
    id: stats
    attributes:
      label: Output of `mtga-pbp stats` (optional)
      description: |
        Useful when a card or an event is missing entirely — it lists annotation types the
        parser did not recognise and cards it could not name.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have removed both players' screen names from anything I pasted
          required: true
        - label: I have removed any `C:\Users\...` paths
          required: true
